name: CI

# The determinism story is only as strong as its enforcement: every push
# re-proves that core/src is float-free and that all golden hashes still
# match, including the 1000-seed property suite.
#
# Unity EditMode tests are NOT run here — they need a licensed Unity editor;
# they run locally via scripts\unity-tests.bat.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Purity check + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md hard rules 1 and 2, enforced mechanically on every push.
      #
      # This step used to hold its own copy of the rule as a grep, calling
      # itself a mirror of scripts\check-purity.bat. A grep cannot tell code
      # from prose, so it matched the word "float" inside the comment that
      # explains floats are banned, and this job failed for days over a core
      # that was clean. The rule now lives in one script both callers run.
      - name: Purity check self-test (the guard's own guard)
        run: python tools/check-purity.py --self-test

      - name: Purity check (core/src is float/Random/DateTime/UnityEngine-free)
        run: python tools/check-purity.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Core test suite (Release — goldens, property suite, codec)
        run: dotnet test core -c Release --nologo
